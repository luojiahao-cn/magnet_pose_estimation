# 磁铁姿态估计器节点配置文件
# 该文件定义了磁铁姿态估计算法的所有配置参数
# 日志级别：DEBUG, INFO, WARN, ERROR, FATAL（默认 INFO）
logging_level: INFO
config:
  # 坐标系配置
  frames:
    output_frame: world
    magnet_frame: magnet_estimated
    enable_tf: true

  # 话题配置
  topics:
    mag_field: /magnetic/sensor/field
    mag_array: /mag_device_sensor/data_mT
    pose_estimate: /magnetic/pose_estimated

  # 参数配置
  params:
    # 估计器配置
    estimator:
      type: optimizer  # 估计器类型（"ekf" 或 "optimizer"）
      tf_timeout: 0.05  # TF变换查询超时时间（秒）

    # EKF 估计器参数（仅当 type: "ekf" 时使用）
    ekf:
      position_gain: 0.02  # 位置增益系数
      process_noise_position: 1.0e-4  # 位置过程噪声方差
      process_noise_orientation: 5.0e-5  # 姿态过程噪声方差
      measurement_noise: 1.0e-3  # 测量噪声方差
      world_field: [0.02, 0.01, 0.045]  # 地球磁场向量 [x, y, z] (mT，毫特斯拉)

    # 预处理器参数
    preprocessor:
      enable_background_removal: false  # 是否启用初始背景磁场采样（静默采集3秒）
      background_removal_duration: 3.0 # 背景采样时长（秒）
      enable_filter: false  # 是否启用低通滤波器
      low_pass_alpha: 0.2  # 低通滤波器alpha系数 (0-1, 越大越平滑)

    # 优化器参数（仅当 type: "optimizer" 时使用）
    optimizer:
      initial_position: [0.0, 0.0, 0.04]  # 初始位置估计 [x, y, z] (米)
      initial_direction: [0.0, 0.0, 1.0]  # 初始磁矩方向向量 [x, y, z]
      position_min: [-0.2, -0.2, 0.01]    # 位置优化下界 [x, y, z] (米)
      position_max: [0.2, 0.2, 0.2]       # 位置优化上界 [x, y, z] (米)
      initial_strength: 0.218  # 初始磁矩强度 (Ampere*meter^2)
      strength_delta: 0.002  # 磁矩强度搜索范围 (±delta)
      optimize_strength: true  # 是否优化磁矩强度
      use_strength_limit: true  # 是否开启磁矩强度限制 (true: 限制在 initial±delta, false: 全局不限制)
      use_position_limit: true  # 是否开启位置范围限制
      max_iterations: 6000  # 最大迭代次数
      num_threads: 2  # 并行计算线程数
      linear_solver: DENSE_QR  # 线性求解器类型

    window_optimizer:
      window_size: 10
      dt: 0.01
      m0: 1.0
      mu0: 4.0 * M_PI * 1e-7
      sigma_meas: 1e-3
      lambda_init: 1.0
      lambda_max: 1e6
      lambda_min: 1e-6
      lambda_factor: 2.0
      lambda_epsilon: 1e-6
