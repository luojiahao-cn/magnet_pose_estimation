# Configuration for Dual Arm Synchronized Scan
# All poses are [x, y, z, roll, pitch, yaw]

# Group names (usually these don't change)
arm1_group: "arm1"
arm2_group: "arm2"
diana7_group: "diana7"
sync_group: "triple_arms"

# Link names
arm1_link: "arm1_ee_link"
arm2_link: "arm2_tool300_tcp_link"
diana7_link: "diana7_bracket_tcp_link"

# ---------- Motion Parameters ----------

# Diana7 Start Pose
diana7_start_pose: [0.52, -0.22, 1.0, 0.0, 3.14159, 1.5708]

# Diana7 End Pose
diana7_end_pose: [0.77, 0.12, 1.0, 0.0, 3.14159, 1.5708]

# Arm2 Start Pose
arm2_start_pose: [0.50, -0.23, 0.97, -1.5708, 0.0, 0.7]

# Arm2 End Pose
arm2_end_pose: [0.75, 0.13, 0.97, -1.5708, 0.0, 0.7]

# Scaling factors
velocity_scaling: 0.01
acceleration_scaling: 0.01

# Cartesian sampling parameters
num_steps: 50
step_wait_time: 1.0

# Output parameters
output_file: "data/dual_arm_scan_results.csv"

